<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoneutria nigriventer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-glow"></div>
    <div class="slider-container">
        <header class="slider-header">
            <p class="slider-kicker">Коллекция образов</p>
            <h1>Темные эстетики: от Y2K до гранжа</h1>
        </header>

        <div class="slider-frame" id="sliderFrame">

        </div>

        <div class="action-row">
            <button class="mix-btn" id="mixBtn" type="button">Авто-сочетание</button>
        </div>

        <div class="nav-panel" id="navPanel"></div>

        <div class="slide-counter" id="slideCounter">
            Слайд 1 / 5
        </div>

        <section class="recommend-panel" id="recommendPanel">
            <p class="recommend-empty">Выбери товар и нажми «С чем носить», чтобы увидеть готовые сочетания.</p>
        </section>

        <section class="cart-panel">
            <div class="cart-head">
                <h2>Корзина</h2>
                <span class="cart-count" id="cartCount">0</span>
            </div>
            <div class="cart-items" id="cartItems">
                <p class="cart-empty">Корзина пуста</p>
            </div>
            <div class="cart-total-row">
                <span>Итого</span>
                <strong id="cartTotal">0 ₽</strong>
            </div>
            <button class="checkout-btn" id="checkoutBtn" type="button">Оформить заказ</button>
        </section>
    </div>


<script src="script.js"></script>
</body>
</html>
